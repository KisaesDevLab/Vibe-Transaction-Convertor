name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @kisaesdevlab/vibe-auth lives on GitHub Packages (scope mapped in
          # .npmrc); setup-node writes the token line for NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@kisaesdevlab'

      - run: pnpm install --frozen-lockfile=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm lint
      # Root pnpm test is already `vitest run --passWithNoTests` so we
      # don't pass `--run` (which pnpm 9 swallows as an unknown option).
      - run: pnpm test
      - run: pnpm build
